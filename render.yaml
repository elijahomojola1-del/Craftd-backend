# Render Blueprint: describes everything CRAFTD's backend needs, so it can be
# created in one go from the Render dashboard (New > Blueprint > this repo).
databases:
  - name: craftd-db
    plan: free
    databaseName: craftd
    user: craftd

services:
  - type: web
    name: craftd-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Database changes are applied on every start, before the server comes up.
    startCommand: python manage.py migrate --noinput && gunicorn firstproject.wsgi:application --bind 0.0.0.0:$PORT --log-file -
    healthCheckPath: /app/gigs/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DATABASE_URL
        fromDatabase:
          name: craftd-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://craftd-1.expo.app
      # Photo storage. Without these, uploaded photos are lost on every deploy.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Leave empty until Paystack is ready; payments stay off without it.
      - key: PAYSTACK_SECRET_KEY
        sync: false
